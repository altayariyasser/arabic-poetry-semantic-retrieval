[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-poetry-semantic-retrieval"
version = "0.1.0"
description = "Arabic poetry retrieval with pretrained multilingual E5, BM25 and reciprocal rank fusion"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["src"]
